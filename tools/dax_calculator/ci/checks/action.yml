name: 'dax_calculator checks'
description: 'Unit and property tests for tools/dax_calculator. Owned by the dax_calculator maintainers, not the repo admins.'

inputs:
  python-version:
    description: 'Python version to test against'
    required: false
    default: '3.11'

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      working-directory: tools/dax_calculator
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip
        .venv/bin/pip install -r requirements.txt

    - name: Run unit tests
      shell: bash
      working-directory: tools/dax_calculator
      run: .venv/bin/pytest test_unit.py -v --tb=short

    - name: Run property tests
      shell: bash
      working-directory: tools/dax_calculator
      run: .venv/bin/pytest test_properties.py -v --tb=short
